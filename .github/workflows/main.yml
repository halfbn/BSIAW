name: CI - Dry Run Secure Pipeline Test

on:
  push:
    branches: [ "test-ci-cd-sec" ]

jobs:
  secure-pipeline-dry-run:
    name: Secure Pipeline Dry Run
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      security-events: write
      contents: read

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    - name: Build Docker image locally
      id: build-image
      run: |
        IMAGE_NAME="test-image-local"
        IMAGE_TAG=${{ github.sha }}
        docker build -t $IMAGE_NAME:$IMAGE_TAG .
        echo "image=$IMAGE_NAME:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Run container for DAST scan
      env:
        DB_USER: ${{ job.services.postgres.env.POSTGRES_USER }}
        DB_PASSWORD: ${{ job.services.postgres.env.POSTGRES_PASSWORD }}
        DB_NAME: ${{ job.services.postgres.env.POSTGRES_DB }}
      run: |
        echo "Starting application container in background..."
        docker run -d --name my-app-for-scan \
          --network host \
          -e "DB_HOST=127.0.0.1" \
          -e "DB_PORT=5432" \
          -e "DB_USER=$DB_USER" \
          -e "DB_PASSWORD=$DB_PASSWORD" \
          -e "DB_NAME=$DB_NAME" \
          ${{ steps.build-image.outputs.image }}

        echo "Waiting for application to start (including migrations)..."
        sleep 20
        
        echo "Checking container status..."
        docker ps -a
        
        echo "Displaying application logs..."
        docker logs my-app-for-scan

    - name: Run OWASP ZAP Baseline Scan
      run: |
        docker run --rm -v $(pwd):/zap/wrk/:rw \
        --network="host" \
        ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
        -t http://127.0.0.1:80 -r report.html
      continue-on-error: true

    - name: Upload DAST Report
      uses: actions/upload-artifact@v4
      with:
        name: dast-zap-report
        path: report.html

    - name: Simulate signing the image
      run: |
        echo "✅ SYMULACJA: W tym kroku obraz ${{ steps.build-image.outputs.image }} zostałby podpisany."
