name: CI - SAST + Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  # =============================
  #  SAST Scan
  # =============================
  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Semgrep
      run: pip install semgrep jq

    - name: Run Semgrep SAST scan
      run: |
        semgrep scan \
          --config=auto \
          --json > semgrep-report.json
    - name: Upload SAST report
      uses: actions/upload-artifact@v4
      with:
        name: sast-report
        path: semgrep-report.json

    - name: Fail pipeline if CRITICAL/ERROR vulnerabilities found
      run: |
        COUNT=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep-report.json)
        if [ "$COUNT" -gt 0 ]; then
          echo "❌ CRITICAL/ERROR vulnerabilities found: $COUNT"
          exit 1
        else
          echo "✅ No CRITICAL vulnerabilities found."
        fi
  dast-scan:
    name: DAST Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
    - uses: actions/checkout@v4
    
    # Krok 1: Instalacja Docker Compose
    - name: Install Docker Compose
      run: |
        sudo apt-get update
        sudo apt-get install -y docker-compose
    
    # Krok 2: Budowa obrazu (jak wcześniej, ale teraz wykorzysta go Compose)
    - name: Build Docker image (bsiaw-app)
      run: docker build -t bsiaw-app .

    # Krok 3: Uruchomienie aplikacji (web) i bazy danych (db)
    - name: Run application and database using Compose
      run: |
        # Compose automatycznie stworzy sieć i uruchomi oba serwisy.
        docker-compose -f docker-compose.yml up -d
        echo "Waiting for app to perform migrations and start..."
        # Czas oczekiwania jest wydłużony, by objąć start bazy, migracje i NginXa/Gunicorna
        sleep 45 
        echo "--- Container status (Compose) ---"
        docker-compose ps
        echo "--- Container logs (web) ---"
        docker-compose logs web || true
        
    - name: Pull ZAP (Optional)
      run: docker pull ghcr.io/zaproxy/zaproxy:stable
      
    # Krok 4: Utworzenie katalogu na raporty ZAP
    - name: Create ZAP output directory
      run: mkdir zap_output
      
    # Krok 5: Zmodyfikowany ZAP DAST scan
    # ZAP jest w sieci 'zapnet' i łączy się z hostem 'web' (aplikacja).
    # Raporty są zapisywane do /zap/output, który jest montowany z folderu zap_output na hoście,
    # co minimalizuje błędy uprawnień (PermissionError).
    - name: Run ZAP Baseline DAST scan
      run: |
        docker run \
          --network zapnet \
          -v "$(pwd)/zap_output":/zap/output \
          ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://web:8000 \
              -g /zap/output/gen.conf \
              -x /zap/output/zap-report.xml \
              -r /zap/output/zap-report.html \
              -J /zap/output/zap-report.json \
              -m 5
              
    # Krok 6: Zatrzymanie Compose i usunięcie kontenerów
    - name: Stop Compose Services
      if: always() # Ważne, aby wykonać ten krok nawet po błędzie
      run: docker-compose down

    # Krok 7: Upload DAST report
    - name: Upload DAST report
      uses: actions/upload-artifact@v4
      with:
        name: dast-report
        path: |
          zap_output/zap-report.xml
          zap_output/zap-report.json
          zap_output/zap-report.html

    - name: DO NOT FAIL (testing)
      run: echo "Skipping fail for DAST test"
  # =============================
  #  Build & Push to ECR
  # =============================
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: sast-scan    # <-- odpali się TYLKO jeśli SAST przejdzie

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Log in to Amazon ECR
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v2
      id: login-ecr

    - name: Build, tag, and push image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
