name: CI - Secure Pipeline (Correct Flow)

on:
  push:
    branches: [ "ci-cd-sec-prez" ]

jobs:
  secure-pipeline-verify-and-push:
    name: Build -> Scan -> Push
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: testdb
      # Nazwa tymczasowa dla lokalnego obrazu
      LOCAL_IMAGE_NAME: local-test-app

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      security-events: write
      contents: read

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    # 1. ANALIZA STATYCZNA (SAST)
    # Wykonywana na kodzie źródłowym przed budową
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    # 2. BUDOWA OBRAZU (Lokalnie)
    # Nie logujemy się jeszcze do AWS, nie wypychamy nic.
    - name: Build Docker image locally
      run: |
        docker build -t ${{ env.LOCAL_IMAGE_NAME }}:latest .

    - name: Fix permissions for DAST volume
      run: sudo chmod -R 777 ${{ github.workspace }}

    # 3. URUCHOMIENIE APLIKACJI DO TESTÓW
    - name: Run container for DAST scan
      run: |
        echo "Starting application locally..."
        docker run -d --name my-app-for-scan \
          --network host \
          -e "DB_HOST=127.0.0.1" \
          -e "DB_PORT=5432" \
          -e "DB_USER=${{ env.POSTGRES_USER }}" \
          -e "DB_PASSWORD=${{ env.POSTGRES_PASSWORD }}" \
          -e "DB_NAME=${{ env.POSTGRES_DB }}" \
          ${{ env.LOCAL_IMAGE_NAME }}:latest

        echo "Waiting for start..."
        sleep 20
        docker logs my-app-for-scan

    # 4. ANALIZA DYNAMICZNA (DAST) - BRAMKA BEZPIECZEŃSTWA
    # Jeśli tu wystąpi błąd (bez flagi -I lub continue-on-error), pipeline się zatrzyma.
    - name: Run OWASP ZAP Baseline Scan
      run: |
        docker run --rm -v $(pwd):/zap/wrk/:rw \
        --network="host" \
        ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
        -t http://127.0.0.1:80 -r report.html -I

    - name: Upload DAST Report
      uses: actions/upload-artifact@v4
      with:
        name: dast-zap-report
        path: report.html

    # 5. PUBLIKACJA (PUSH TO ECR)
    # Ten kod wykona się TYLKO jeśli poprzednie kroki (SAST i DAST) zakończyły się sukcesem.
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Tag and Push image to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        IMAGE_TAG: test2
      run: |
        # Tagujemy lokalny obraz adresem rejestru AWS
        docker tag ${{ env.LOCAL_IMAGE_NAME }}:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        
        echo "Pushing image to ECR..."
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        
        echo "✅ SUCCESS: Image pushed to ECR only after passing security checks."
