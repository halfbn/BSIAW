name: CI - SAST + Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  dast-scan:
    name: DAST Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: build-and-push   # skanujemy aplikację po zbudowaniu

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t bsiaw-app .

    - name: Run application container
      run: |
        docker run -d -p 8000:8000 --name bsiaw bsiaw-app
        sleep 10  # czekamy aż aplikacja wstanie

    - name: Install ZAP
      run: docker pull ghcr.io/zaproxy/zaproxy:stable

    - name: Run ZAP Baseline DAST scan
      run: |
        docker run --network="host" \
          -v $(pwd):/zap/wrk \
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:8000 \
            -g gen.conf \
            -x zap-report.xml \
            -r zap-report.html \
            -J zap-report.json \
            -m 5

    - name: Upload DAST report
      uses: actions/upload-artifact@v4
      with:
        name: dast-report
        path: |
          zap-report.xml
          zap-report.json
          zap-report.html

    - name: Fail on High Risk issues
      run: |
        if grep -q "FAIL-NEW:" zap-report.html; then
          echo "❌ High-risk vulnerabilities found!"
          exit 1
        else
          echo "✅ No high-risk vulnerabilities."
        fi

  # =============================
  #  SAST Scan
  # =============================
  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Semgrep
      run: pip install semgrep jq

    - name: Run Semgrep SAST scan
      run: |
        semgrep scan \
          --config=auto \
          --json > semgrep-report.json

    - name: Upload SAST report
      uses: actions/upload-artifact@v4
      with:
        name: sast-report
        path: semgrep-report.json

    - name: Fail pipeline if CRITICAL/ERROR vulnerabilities found
      run: |
        COUNT=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep-report.json)
        if [ "$COUNT" -gt 0 ]; then
          echo "❌ CRITICAL/ERROR vulnerabilities found: $COUNT"
          exit 1
        else
          echo "✅ No CRITICAL vulnerabilities found."
        fi

  # =============================
  #  Build & Push to ECR
  # =============================
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: sast-scan    # <-- odpali się TYLKO jeśli SAST przejdzie

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Log in to Amazon ECR
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v2
      id: login-ecr

    - name: Build, tag, and push image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
