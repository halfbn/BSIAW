name: CI - Secure Pipeline (ECR Test Tag)

on:
  push:
    branches: [ "ci-cd-sec-prez" ]

jobs:
  secure-pipeline-ecr-test:
    name: Build, Scan & Push (Test)
    runs-on: ubuntu-latest

    # Zmienne dla bazy danych (nadal hardcoded na potrzeby testu)
    env:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: testdb

    # Usługa bazy danych (wymagana do działania aplikacji podczas testów DAST)
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      security-events: write
      contents: read

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    # --- SEKCJA SAST (CodeQL) ---
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    # --- SEKCJA AWS (Logowanie) ---
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # --- SEKCJA BUILD & PUSH (ECR) ---
    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        # Ustawiamy sztywny tag "test" zgodnie z życzeniem
        IMAGE_TAG: test
      run: |
        FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        
        echo "Building image: $FULL_IMAGE"
        docker build -t $FULL_IMAGE .
        
        echo "Pushing image to ECR..."
        docker push $FULL_IMAGE
        
        # Zapisujemy nazwę obrazu do zmiennej wyjściowej, aby użyć jej w kroku DAST
        echo "image=$FULL_IMAGE" >> $GITHUB_OUTPUT

    # --- PRZYGOTOWANIE DO DAST ---
    - name: Fix permissions (Workaround)
      run: sudo chmod -R 777 ${{ github.workspace }}
      
    - name: Run container for DAST scan
      run: |
        echo "Starting application container from ECR image..."
        # Używamy obrazu zbudowanego i otagowanego dla ECR
        docker run -d --name my-app-for-scan \
          --network host \
          -e "DB_HOST=127.0.0.1" \
          -e "DB_PORT=5432" \
          -e "DB_USER=${{ env.POSTGRES_USER }}" \
          -e "DB_PASSWORD=${{ env.POSTGRES_PASSWORD }}" \
          -e "DB_NAME=${{ env.POSTGRES_DB }}" \
          ${{ steps.build-image.outputs.image }}

        echo "Waiting for application to start..."
        sleep 20
        
        echo "Checking container logs:"
        docker logs my-app-for-scan

    # --- SEKCJA DAST (OWASP ZAP) ---
    - name: Run OWASP ZAP Baseline Scan
      run: |
        docker run --rm -v $(pwd):/zap/wrk/:rw \
        --network="host" \
        ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
        -t http://127.0.0.1:80 -r report.html -I

    - name: Upload DAST Report
      uses: actions/upload-artifact@v4
      with:
        name: dast-zap-report
        path: report.html

    # --- SEKCJA FINALNA ---
    - name: Pipeline Summary
      run: |
        echo "✅ Obraz został przeskanowany (SAST/DAST) i wypchnięty do ECR z tagiem 'test'."
        echo "🖼️ Obraz: ${{ steps.build-image.outputs.image }}"
