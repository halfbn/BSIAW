name: CI - Dry Run Secure Pipeline Test

# Uruchom ten workflow TYLKO na branchu testowym
on:
  push:
    branches: [ "feature/secure-pipeline-test" ]

jobs:
  secure-pipeline-dry-run:
    name: Secure Pipeline Dry Run
    runs-on: ubuntu-latest

    permissions:
      # Wymagane do wysyłania wyników skanowania CodeQL do GitHub
      security-events: write
      contents: read

    steps:
    # =======================================================
    #  KROK 1: POBRANIE KODU - bez zmian
    # =======================================================
    - name: Check out code
      uses: actions/checkout@v4

    # =======================================================
    #  KROK 2: SKANOWANIE SAST (CODEQL) - bez zmian
    # =======================================================
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: 'go, javascript, python, ruby' # Możesz dostosować języki lub usunąć tę linię, aby CodeQL sam je wykrył

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    # =======================================================
    #  KROK 3: SYMULACJA BUDOWANIA OBRAZU DOCKER
    # =======================================================
    - name: Build Docker image locally
      id: build-image
      run: |
        # Definiujemy zmyślone nazwy, bo nie łączymy się z ECR
        IMAGE_NAME="test-image-local"
        IMAGE_TAG=${{ github.sha }}
        
        # Budujemy obraz lokalnie na runnerze
        docker build -t $IMAGE_NAME:$IMAGE_TAG .
        
        # Przekazujemy nazwę lokalnego obrazu do kolejnych kroków
        echo "image=$IMAGE_NAME:$IMAGE_TAG" >> $GITHUB_OUTPUT
    
    # === KROKI ZWIĄZANE Z AWS SĄ CELOWO POMINIĘTE/KOMENTOWANE ===
    # - name: Configure AWS credentials
    # - name: Login to Amazon ECR
    # - name: Push image to Amazon ECR

    # =======================================================
    #  KROK 4: SKANOWANIE DAST (OWASP ZAP) - bez zmian
    # =======================================================
    - name: Run container for DAST scan
      run: |
        # Uruchamiamy lokalnie zbudowany obraz w tle
        docker run -d --name my-app-for-scan -p 8080:8080 ${{ steps.build-image.outputs.image }}
        # Dajmy aplikacji chwilę na uruchomienie
        sleep 15

    - name: Run OWASP ZAP Baseline Scan
      run: |
        docker run --rm -v $(pwd):/zap/wrk/:rw \
        --network="host" \
        owasp/zap2docker-stable zap-baseline.py \
        -t http://127.0.0.1:8080 -r report.html
      # Kontynuuj nawet jeśli ZAP znajdzie błędy, aby raport został zapisany
      continue-on-error: true

    - name: Upload DAST Report
      uses: actions/upload-artifact@v4
      with:
        name: dast-zap-report
        path: report.html

    # =======================================================
    #  KROK 5: SYMULACJA PODPISYWANIA (COSIGN)
    # =======================================================
    - name: Simulate signing the image
      run: |
        echo "✅ SYMULACJA: W tym kroku obraz ${{ steps.build-image.outputs.image }} zostałby podpisany."
        echo "W prawdziwym pipeline, komenda 'cosign sign' zostałaby tutaj wykonana."
