name: CI - SAST + DAST + Build

on:
  push:
    branches: [ "main" ]

jobs:

  # =============================
  #  SAST Scan
  # =============================
  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Semgrep
      run: pip install semgrep jq

    - name: Run Semgrep SAST scan
      run: |
        semgrep scan --config=auto --json > semgrep-report.json

    - name: Upload SAST report
      uses: actions/upload-artifact@v4
      with:
        name: sast-report
        path: semgrep-report.json

    - name: DO NOT FAIL (testing)
      run: echo "Skipping fail for SAST test"


  # =============================
  #  DAST Scan (ZAP)
  # =============================
  dast-scan:
    name: DAST Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: sast-scan
  
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: bsiaw
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user -d bsiaw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
  
    steps:
    - uses: actions/checkout@v4
  
    - name: Build Docker image
      run: docker build -t bsiaw-app .
  
    - name: Create Docker network
      run: docker network create zapnet
  
    - name: Run application container
      env:
        DB_NAME: bsiaw
        DB_USER: user
        DB_PASS: pass
        DB_HOST: postgres
        DB_PORT: 5432
      run: |
        docker run -d \
          --network zapnet \
          --name bsiaw \
          -e DB_NAME=$DB_NAME \
          -e DB_USER=$DB_USER \
          -e DB_PASS=$DB_PASS \
          -e DB_HOST=$DB_HOST \
          -e DB_PORT=$DB_PORT \
          -p 8000:8000 \
          bsiaw-app
  
        echo "Waiting for app to start..."
        sleep 25
  
        docker ps -a
        docker logs bsiaw || true
  
    - name: Pull ZAP
      run: docker pull ghcr.io/zaproxy/zaproxy:stable
  
    - name: Run ZAP Baseline DAST scan
      run: |
        docker run \
          --network zapnet \
          -v "$(pwd)":/zap/wrk \
          ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://bsiaw:8000 \
              -g gen.conf \
              -x zap-report.xml \
              -r zap-report.html \
              -J zap-report.json \
              -m 5
  
    - name: Upload DAST report
      uses: actions/upload-artifact@v4
      with:
        name: dast-report
        path: |
          zap-report.xml
          zap-report.json
          zap-report.html
  
    - name: DO NOT FAIL (testing)
      run: echo "Skipping fail for DAST test"

  # =============================
  #  Build & Push to ECR
  # =============================
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: dast-scan

    steps:
    - uses: actions/checkout@v4

    - name: Log in to Amazon ECR
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v2
      id: login-ecr

    - name: Build, tag, and push image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
