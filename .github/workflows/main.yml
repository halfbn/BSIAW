name: CI - SAST + DAST + Build and Push Docker Image

on:
  push:
    branches: ["main"]

jobs:
  # =============================
  #  SAST Scan
  # =============================
  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Semgrep
      run: pip install semgrep jq

    - name: Run Semgrep scan
      run: |
        semgrep scan --config=auto --json > semgrep-report.json

    - name: Upload SAST report
      uses: actions/upload-artifact@v4
      with:
        name: sast-report
        path: semgrep-report.json

    # ❗ WYŁĄCZAMY FAILOWANIE (żeby testować DAST)
    - name: (TEMP) Do not fail on findings
      run: echo "Skipping fail for now."


  # =============================
  #  Build Docker Image
  # =============================
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: sast-scan   # <-- odpala się po SAST

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t bsiaw-app .


  # =============================
  #  DAST Scan
  # =============================
  dast-scan:
    name: DAST Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: build-image   # <-- działa po build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run application container
      run: |
        docker run -d -p 8000:8000 --name bsiaw bsiaw-app
        sleep 10

    - name: Pull ZAP
      run: docker pull ghcr.io/zaproxy/zaproxy:stable

    - name: Run ZAP Baseline Scan
      run: |
        docker run --network="host" \
          -v $(pwd):/zap/wrk \
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:8000 \
            -g gen.conf \
            -x zap-report.xml \
            -r zap-report.html \
            -J zap-report.json \
            -m 5

    - name: Upload DAST report
      uses: actions/upload-artifact@v4
      with:
        name: dast-report
        path: |
          zap-report.xml
          zap-report.json
          zap-report.html

    # ❗ TEŻ WYŁĄCZAM FAILOWANIE, żeby testować
    - name: (TEMP) Do not fail on DAST
      run: echo "Skipping fail for now."


  # =============================
  #  Push do ECR
  # =============================
  push-to-ecr:
    name: Push to ECR
    runs-on: ubuntu-latest
    needs: dast-scan   # <-- działa dopiero po DAST

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Amazon ECR
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v2
      id: login-ecr

    - name: Tag & Push image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        IMAGE_TAG: latest
      run: |
        docker tag bsiaw-app $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
