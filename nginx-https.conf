# HTTPS server
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/ssl/certs/ssl-cert.pem;
    ssl_certificate_key /etc/ssl/private/ssl-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/ {
        alias /bsiaw/static/;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Nagłówki bezpieczeństwa
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 
'self' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; 
object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; worker-src 'self';" 
always;
}

# HTTP -> HTTPS redirect (dla produkcji)
server {
    listen 80;
    server_name localhost;

    return 301 https://$host$request_uri;
}

